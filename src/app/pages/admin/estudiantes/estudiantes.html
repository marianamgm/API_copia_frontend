<div class="container">

 
  <h2>Crear Estudiante</h2>

  <div class="form">

    <input type="text"
           placeholder="Nombre"
           [(ngModel)]="nuevo.est_Nombre">

    <input type="email"
           placeholder="Correo"
           [(ngModel)]="nuevo.est_Correo">

    <input type="text"
           placeholder="Carrera"
           [(ngModel)]="nuevo.est_Carrera">

    <button (click)="guardar()">Guardar</button>

  </div>

  <br><br>

  <h2>Lista de Estudiantes</h2>

  <table>

    <tr>
      <th>Nombre</th>
      <th>Correo</th>
      <th>Carrera</th>
      <th>Acciones</th>
    </tr>

    <tr *ngFor="let item of lista">

      <td>{{ item.est_Nombre }}</td>
      <td>{{ item.est_Correo }}</td>
      <td>{{ item.est_Carrera }}</td>

      <td>
        <button class="btn eliminar" (click)="eliminar(item.est_Id)">
          Eliminar
        </button>
      </td>

    </tr>

  </table>

</div>
