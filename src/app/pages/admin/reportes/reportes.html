<div class="container">

  <h2>Reportes</h2>

  <table>

    <tr>
      <th>ID</th>
      <th>Estudiante</th>
      <th>Estado</th>
      <th>Fecha</th>
    </tr>

    <tr *ngFor="let item of lista">
      <td>{{ item.rep_Id }}</td>
      <td>{{ item.rep_Estudiante }}</td>
      <td>{{ item.rep_Estado }}</td>
      <td>{{ item.rep_Fecha | date:'short' }}</td>
    </tr>

  </table>

</div>
