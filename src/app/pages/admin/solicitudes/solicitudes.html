<div class="container">


  <h2>Crear Solicitud</h2>

  <div class="form">

    <input type="text"
           placeholder="Correo del estudiante"
           [(ngModel)]="nuevo.sol_CorreoEst">

    <select [(ngModel)]="nuevo.sol_Estado">
      <option value="">Selecciona estado</option>
      <option value="Pendiente">Pendiente</option>
      <option value="Aprobada">Aprobada</option>
      <option value="Rechazada">Rechazada</option>
    </select>

    <button (click)="guardar()">Guardar Solicitud</button>

  </div>

  <br><br>

  <h2>Lista de Solicitudes</h2>

  <table>

    <tr>
      <th>Correo</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>

    <tr *ngFor="let s of lista">

      <td>{{ s.sol_CorreoEst }}</td>
      <td>{{ s.sol_Estado }}</td>

      <td>

        <button class="btn aprobar" (click)="aprobar(s)">
          Aprobar
        </button>

        <button class="btn rechazar" (click)="rechazar(s)">
          Rechazar
        </button>

      </td>

    </tr>

  </table>

</div>
